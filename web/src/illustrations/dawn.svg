<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="t-dawn">
  <title id="t-dawn">Dawn spacecraft orbiting Ceres blueprint</title>
  <g class="svg-orbit" opacity="0.28">
    <circle class="svg-dashed" cx="180" cy="108" r="92" stroke-dasharray="3 6"/>
  </g>
  <!-- Xenon ion thruster plume -->
  <g class="svg-signal" opacity="0.7">
    <path d="M172 132 L180 162 L188 132"/>
    <path d="M176 132 L180 150 L184 132"/>
  </g>
  <g class="svg-craft">
    <!-- Massive 20-meter Dutch-built solar wings with cell grid -->
    <rect x="14" y="84" width="122" height="34" rx="2"/>
    <path d="M44 84 L44 118 M74 84 L74 118 M104 84 L104 118 M14 101 L136 101"/>
    <rect x="224" y="84" width="122" height="34" rx="2"/>
    <path d="M256 84 L256 118 M286 84 L286 118 M316 84 L316 118 M224 101 L346 101"/>
    <path d="M136 101 L154 101 M206 101 L224 101"/>
    <!-- Central composite bus & 1.5m high-gain dish -->
    <rect x="154" y="78" width="52" height="46" rx="3"/>
    <ellipse cx="180" cy="64" rx="28" ry="10"/>
    <path d="M180 64 L180 48"/>
    <circle cx="180" cy="46" r="2.5"/>
    <!-- Three NSTAR ion thruster nozzles -->
    <rect x="166" y="124" width="8" height="6"/>
    <rect x="176" y="124" width="8" height="8"/>
    <rect x="186" y="124" width="8" height="6"/>
  </g>
  <!-- Dwarf planet Ceres curvature & Occator bright spots below -->
  <path d="M36 196 Q180 152 324 196" opacity="0.45"/>
  <circle cx="180" cy="182" r="2" opacity="0.8"/><circle cx="186" cy="183" r="1.2" opacity="0.7"/>
</svg>
