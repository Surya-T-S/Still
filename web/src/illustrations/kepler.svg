<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="t-kep">
  <title id="t-kep">Kepler Space Telescope exoplanet hunter blueprint</title>
  <g class="svg-orbit" opacity="0.28">
    <circle class="svg-dashed" cx="180" cy="110" r="90" stroke-dasharray="3 6"/>
  </g>
  <!-- Transit light-curve telemetry wave & target starfield -->
  <g class="svg-signal" opacity="0.75">
    <path d="M52 46 L86 46 L94 60 L110 60 L118 46 L152 46"/>
    <circle cx="102" cy="32" r="2.5"/>
    <circle cx="268" cy="38" r="2"/>
  </g>
  <g class="svg-craft">
    <!-- Photometer telescope barrel (tilted in heliocentric orbit) -->
    <path d="M138 56 L214 56 L214 148 L138 148 Z"/>
    <path d="M138 82 L214 82 M138 116 L214 116"/>
    <!-- Angled sunshade baffle at top -->
    <path d="M138 56 L156 26 L214 40 L214 56"/>
    <ellipse cx="185" cy="42" rx="28" ry="7" opacity="0.6"/>
    <!-- Hexagonal spacecraft bus & high-gain antenna -->
    <path d="M130 148 L222 148 L230 168 L122 168 Z"/>
    <path d="M176 168 L176 188"/>
    <ellipse cx="176" cy="190" rx="18" ry="5"/>
    <!-- 4-panel coplanar solar array sunshield -->
    <path d="M138 92 L58 118 L64 152 L138 134"/>
    <path d="M96 106 L100 142"/>
    <path d="M214 92 L294 118 L288 152 L214 134"/>
    <path d="M256 106 L252 142"/>
  </g>
</svg>
