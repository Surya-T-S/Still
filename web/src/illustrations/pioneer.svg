<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="t-pio">
  <title id="t-pio">Pioneer 10 and 11 interstellar probe technical blueprint</title>
  <g class="svg-orbit" opacity="0.28">
    <circle class="svg-dashed" cx="180" cy="110" r="92" stroke-dasharray="3 6"/>
  </g>
  <g class="svg-signal" opacity="0.65">
    <path d="M150 26 Q180 10 210 26"/>
    <path d="M136 16 Q180 -4 224 16"/>
  </g>
  <g class="svg-craft">
    <!-- 2.74-meter parabolic high-gain dish & tripod feed horn -->
    <ellipse cx="180" cy="82" rx="86" ry="24"/>
    <ellipse cx="180" cy="82" rx="48" ry="12" opacity="0.55"/>
    <path d="M142 82 L180 34 L218 82 M180 82 L180 34"/>
    <rect x="173" y="28" width="14" height="8" rx="1"/>
    <!-- Hexagonal equipment compartment & Pioneer Golden Plaque mount -->
    <path d="M148 106 L212 106 L220 132 L140 132 Z"/>
    <rect x="172" y="114" width="16" height="10" rx="1"/>
    <!-- Twin SNAP-19 RTG nuclear power booms (3 meters out) -->
    <path d="M144 116 L46 150 M144 124 L46 156"/>
    <rect x="26" y="146" width="22" height="14" rx="2"/>
    <path d="M216 116 L314 150 M216 124 L314 156"/>
    <rect x="312" y="146" width="22" height="14" rx="2"/>
    <!-- 6.5-meter helium vector magnetometer boom -->
    <path d="M180 132 L180 202"/>
    <circle cx="180" cy="202" r="3.5"/>
  </g>
</svg>
